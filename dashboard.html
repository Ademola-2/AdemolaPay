<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Your AdemolaPay account dashboard."><title>My account | AdemolaPay"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/auth.css"><style>.dashboard-card{max-width:640px;margin:45px auto;padding:35px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 24px 75px #35205c12}.dashboard-card h1{font:800 30px/1.2 Manrope,sans-serif;letter-spacing:-1px}.dashboard-card p{color:var(--muted);font-size:13px}.dashboard-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.dashboard-actions a,.dashboard-actions button{padding:12px 17px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--purple);font:700 12px 'DM Sans',sans-serif;cursor:pointer}.dashboard-actions .primary{background:var(--purple);color:white;border-color:var(--purple)}@media(max-width:600px){.dashboard-card{margin:25px 16px;padding:25px}}</style></head>
<body><header class="auth-header"><a class="brand" href="index.html"><span class="brand-mark">A<span>+</span></span><span>Ademola<span class="brand-pay">Pay</span></span></a><button class="back-link" id="signOut" style="border:0;background:none;cursor:pointer">Sign out</button></header><main class="dashboard-card"><span class="form-kicker">YOUR ACCOUNT</span><h1>Welcome, <span id="userName">there</span>!</h1><p>Your AdemolaPay account is ready. Airtime, data, and bill-payment purchases will be added after we connect the secure payment services.</p><div class="form-message" id="dashboardMessage" role="alert"></div><div class="dashboard-actions"><a class="primary" href="index.html#services">Explore services</a><button id="signOutAlt" type="button">Sign out</button></div></main><footer class="auth-footer">© <span id="year"></span> AdemolaPay. Everyday payments, made simple.</footer><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="js/firebase-config.js"></script><script>document.getElementById('year').textContent=new Date().getFullYear();const msg=document.getElementById('dashboardMessage');function out(){firebase.auth().signOut().then(()=>location.href='signin.html').catch(()=>{msg.textContent='Unable to sign out. Check your connection and try again.';msg.className='form-message show error'})}document.getElementById('signOut').addEventListener('click',out);document.getElementById('signOutAlt').addEventListener('click',out);if(typeof firebase!=='undefined'&&firebase.apps.length){firebase.auth().onAuthStateChanged(user=>{if(!user){location.replace('signin.html');return}document.getElementById('userName').textContent=user.displayName||user.email.split('@')[0]})}else{msg.textContent='Firebase configuration is not complete yet.';msg.className='form-message show error'}</script></body></html>
